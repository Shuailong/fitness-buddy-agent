# Lint + unit tests on every pull request and push. No cloud credentials needed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    env:
      FITNESS_STORAGE_BACKEND: memory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint (ruff)
        run: uv run ruff check app fitness_core web

      - name: Unit tests (deterministic core, tools, web app)
        run: uv run pytest tests/unit -q

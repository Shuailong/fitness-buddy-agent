# Eval-gated continuous deployment to a single Google Cloud project.
#
#   CI (lint + unit tests) -> eval gate (golden dataset, thresholds) -> deploy
#   agent to Agent Runtime + deploy web app to Cloud Run.
#
# Keyless auth: GitHub OIDC -> Workload Identity Federation -> deployer service
# account (provisioned by deployment/terraform/single-project/fitness_buddy.tf).
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   secrets.WIF_PROVIDER            Terraform output `workload_identity_provider`
#   secrets.GCP_SERVICE_ACCOUNT     Terraform output `deployer_service_account`
#   vars.GCP_PROJECT_ID, vars.GCP_REGION
#   vars.AGENT_RUNTIME_RESOURCE     Terraform output `agent_runtime_resource`
name: Eval gate and deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'fitness_core/**'
      - 'web/**'
      - 'tests/eval/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy.yaml'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  # Only agent-affecting changes run the (LLM-heavy) eval gate and redeploy the
  # agent; web-only changes go straight to the web deploy after CI.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agent:
              - 'app/**'
              - 'fitness_core/**'
              - 'tests/eval/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/deploy.yaml'

  eval-gate:
    needs: [ci, changes]
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_GENAI_USE_ENTERPRISE: 'true'
      # Evals send intentionally unsafe test prompts (safety cases), so model
      # calls (agent under test and LLM judges) run in a dedicated eval project,
      # never in the production Gemini project.
      GOOGLE_CLOUD_PROJECT: ${{ vars.EVAL_GEMINI_PROJECT || vars.GEMINI_PROJECT || vars.GCP_PROJECT_ID }}
      GEMINI_PROJECT: ${{ vars.EVAL_GEMINI_PROJECT || vars.GEMINI_PROJECT }}
      GOOGLE_CLOUD_LOCATION: global
      FITNESS_STORAGE_BACKEND: memory
      FITNESS_EVAL_ISOLATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # The auth action exports GOOGLE_CLOUD_PROJECT; point it at the Gemini
          # project so the LLM judges run there too.
          project_id: ${{ vars.EVAL_GEMINI_PROJECT || vars.GEMINI_PROJECT || vars.GCP_PROJECT_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run golden eval (agents-cli)
        run: uvx google-agents-cli@1.10.0 eval run --dataset tests/eval/datasets/golden-dataset.json
      - name: Enforce eval thresholds
        run: uv run python tests/eval/check_thresholds.py
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: artifacts/grade_results/

  deploy-agent:
    needs: eval-gate
    if: needs.eval-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Point agents-cli at the Terraform-managed Agent Runtime resource
        run: |
          printf '{"remote_agent_runtime_id": "%s", "deployment_timestamp": null}\n' \
            "${{ vars.AGENT_RUNTIME_RESOURCE }}" > deployment_metadata.json
      - name: Deploy agent to Agent Runtime
        run: |
          uvx google-agents-cli@1.10.0 deploy \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --no-agent-identity \
            --service-account "fitness-buddy-agent@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --cpu 2 --memory 4Gi --min-instances 1 --max-instances 10 --concurrency 9 \
            --update-env-vars="FITNESS_GCP_PROJECT=${{ vars.GCP_PROJECT_ID }},FITNESS_STORAGE_BACKEND=firestore,MODEL_ARMOR_ENABLED=true,MODEL_ARMOR_LOCATION=${{ vars.GCP_REGION }},MODEL_ARMOR_TEMPLATE_ID=fitness-buddy-guard,DLP_ENABLED=true,HEALTH_JUDGE_ENABLED=true,GEMINI_PROJECT=${{ vars.GEMINI_PROJECT }},OTEL_RESOURCE_ATTRIBUTES=service.version=${{ github.sha }}"

  deploy-web:
    needs: [ci, eval-gate]
    if: >-
      always() && needs.ci.result == 'success' &&
      (needs.eval-gate.result == 'success' || needs.eval-gate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy web app (Cloud Build -> Artifact Registry -> Cloud Run)
        run: |
          gcloud builds submit . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --config web/cloudbuild.yaml \
            --substitutions="_REGION=${{ vars.GCP_REGION }},_TAG=${{ github.sha }}"
